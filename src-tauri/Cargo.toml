[package]
name = "hebe"
version = "1.2.0"
description = "Hebe - A next-generation WYSIWYG Markdown editor"
authors = ["Hebe Contributors"]
license = "MIT"
repository = "https://github.com/Hong1495/Hebe"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri-plugin-updater = "2"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-store = "2"
tauri-plugin-window-state = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
pulldown-cmark = "0.12"
resvg = "0.45.1"
base64 = "0.22"
tempfile = "3"

[profile.release]
strip = true

# Keep proc-macro dylibs loadable by the macOS linker during release builds.
[profile.release.build-override]
strip = false

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSView", "NSButton"] }
